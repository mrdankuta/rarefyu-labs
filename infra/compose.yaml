# Single-VPS control plane (spec #30). Workspaces are NOT defined here: the API
# creates one hardened Docker + gVisor container per student through the host's
# Docker engine. This file runs only: caddy (TLS + routing), web, api, postgres.
#
#   cp .env.example .env   # fill in secrets; provision-vps.sh writes DOCKER_GID for you
#   docker compose -f infra/compose.yaml up -d --build
#
# api and caddy run on the HOST network: the api must reach each workspace's private
# bridge network (preview proxy) and mounts the Docker socket (that is what lets it
# create workspaces; treat the api image as trusted code).

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Host network: it binds :80/:443 directly and reaches api (:3000) and web (:3001) over
    # loopback, so no host-firewall rule is needed for container-to-host traffic.
    network_mode: host
    # Set SITE_ADDRESS=labs.example.com in .env for automatic HTTPS; default is plain :80.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web, api]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3000"]   # loopback only; caddy proxies to it
    environment:
      PORT: "3000"
      PUBLIC_DEFAULT_LAYOUT: ${PUBLIC_DEFAULT_LAYOUT:-}   # "classic" forces the Classic layout (kill switch for Chat)

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    network_mode: host
    group_add: ["${DOCKER_GID:-999}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/snapshots:/data/snapshots
      - /data/seats:/data/seats               # class seats (model keys), 0600
    environment:
      API_PORT: "3000"
      DRIVER: ${DRIVER:-docker-gvisor}        # refuses to run workspaces without gVisor
      LAB_IMAGE: ${LAB_IMAGE:-rarefyu/base-lab:dev}
      SNAPSHOT_DIR: /data/snapshots
      DATA_DIR: /data/seats
      SEATS_REQUIRED: ${SEATS_REQUIRED:-0}     # 1 = workspaces need a class code
      SEAT_TTL_MIN: ${SEAT_TTL_MIN:-480}       # class-seat workspace lifetime (minutes)
      SEAT_DEFAULT_MODEL: ${SEAT_DEFAULT_MODEL:-opencode-go/kimi-k3}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env (protects kill switch / reconcile)}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?set PREVIEW_SECRET in .env}
      MAX_WORKSPACES_GLOBAL: ${MAX_WORKSPACES_GLOBAL:-20}
      MAX_WORKSPACES_PER_IP: ${MAX_WORKSPACES_PER_IP:-3}
      WORKSPACE_RESOLV_CONF: ${WORKSPACE_RESOLV_CONF:-}  # HOST path; required under gVisor (see vps-deploy-notes.md)
      WORKSPACE_CPUS: ${WORKSPACE_CPUS:-1}
      WORKSPACE_MEMORY: ${WORKSPACE_MEMORY:-2g}
      POSTGRES_URL: ${POSTGRES_URL:-postgres://labs:${POSTGRES_PASSWORD:-labs}@127.0.0.1:5432/labs}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost}
    depends_on: [postgres]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: labs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labs}
      POSTGRES_DB: labs
    # api is on the host network, so publish postgres on loopback only.
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

volumes:
  caddy-data: {}
  pgdata: {}
